[project]
name = "groundstack-api"
version = "0.1.0"
description = "FastAPI backend for GroundStack."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.4",
  "authlib>=1.6.5",
  "asyncpg>=0.30.0",
  "beautifulsoup4>=4.13.4",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "markdown-it-py>=4.0.0",
  "PyJWT[crypto]>=2.10.1",
  "pydantic-settings>=2.10.1",
  "pypdf>=6.1.0",
  "python-multipart>=0.0.20",
  "sentence-transformers>=5.1.2",
  "sqlalchemy[asyncio]>=2.0.43",
  "structlog>=25.4.0",
  "uvicorn[standard]>=0.35.0"
]

[project.optional-dependencies]
dev = [
  "locust>=2.37.0",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.9"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that exercise external services or command-line clients",
]
