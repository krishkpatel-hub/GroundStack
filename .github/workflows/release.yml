name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version such as 1.2.3
        required: true
      push_ghcr:
        description: Push images to GHCR
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: groundstack
          POSTGRES_PASSWORD: groundstack
          POSTGRES_DB: groundstack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U groundstack -d groundstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
      - name: Install PostgreSQL 17 client utilities
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Verify PostgreSQL 17 client utilities
        run: |
          command -v pg_dump
          pg_dump --version
          command -v pg_restore
          pg_restore --version
          command -v psql
          psql --version
          pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 17\.'
          pg_restore --version | grep -Eq '^pg_restore \(PostgreSQL\) 17\.'
          psql --version | grep -Eq '^psql \(PostgreSQL\) 17\.'
      # docker/setup-buildx-action v3.11.0
      - uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0
      - name: Compute metadata
        id: meta
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          repo_lower="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repo_lower=$repo_lower" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint --workspace apps/web
      - run: npm run typecheck --workspace apps/web
      - run: npm run test --workspace apps/web
      - run: npm run build --workspace apps/web
      - run: python -m pip install -e "apps/api[dev]"
      - run: cd apps/api && ruff format --check .
      - run: cd apps/api && ruff check .
      - run: python -m compileall -q apps/api/app
      - run: cd apps/api && alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://groundstack:groundstack@localhost:5432/groundstack
      - run: cd apps/api && pytest
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://groundstack:groundstack@localhost:5432/groundstack
      - run: cd training && PYTHONPATH=. python -m pytest
      - run: PYTHONPATH=evaluation python -m pytest evaluation/tests
      - run: PYTHONPATH=evaluation python evaluation/runners/run_eval.py --suite all
      - run: python scripts/check_migrations.py
      - run: docker build -f apps/api/Dockerfile -t groundstack-api:${{ steps.meta.outputs.version }} -t groundstack-api:${{ steps.meta.outputs.sha }} -t ghcr.io/${{ steps.meta.outputs.repo_lower }}/groundstack-api:${{ steps.meta.outputs.version }} -t ghcr.io/${{ steps.meta.outputs.repo_lower }}/groundstack-api:${{ steps.meta.outputs.sha }} .
      - run: docker build -f apps/web/Dockerfile -t groundstack-web:${{ steps.meta.outputs.version }} -t groundstack-web:${{ steps.meta.outputs.sha }} -t ghcr.io/${{ steps.meta.outputs.repo_lower }}/groundstack-web:${{ steps.meta.outputs.version }} -t ghcr.io/${{ steps.meta.outputs.repo_lower }}/groundstack-web:${{ steps.meta.outputs.sha }} .
      - name: Inspect image digests
        id: images
        run: |
          echo "api_digest=$(docker image inspect --format='{{.Id}}' groundstack-api:${{ steps.meta.outputs.version }})" >> "$GITHUB_OUTPUT"
          echo "web_digest=$(docker image inspect --format='{{.Id}}' groundstack-web:${{ steps.meta.outputs.version }})" >> "$GITHUB_OUTPUT"
      - name: Generate SBOMs
        run: |
          docker sbom groundstack-api:${{ steps.meta.outputs.version }} --format spdx-json > api.sbom.spdx.json || true
          docker sbom groundstack-web:${{ steps.meta.outputs.version }} --format spdx-json > web.sbom.spdx.json || true
      - name: Generate build provenance
        run: |
          mkdir -p release
          python - <<'PY'
          import json
          import os

          provenance = {
              "builder": "github-actions",
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_ref": os.environ["GITHUB_REF"],
              "source_sha": os.environ["GITHUB_SHA"],
          }
          with open("release/provenance.json", "w", encoding="utf-8") as handle:
              json.dump(provenance, handle, indent=2)
              handle.write("\n")
          PY
      - name: Release manifest
        run: |
          mkdir -p release
          cat > release/manifest.json <<JSON
          {
            "application_version": "${{ steps.meta.outputs.version }}",
            "git_commit": "${{ steps.meta.outputs.sha }}",
            "images": {
              "api": {
                "tags": [
                  "groundstack-api:${{ steps.meta.outputs.version }}",
                  "groundstack-api:${{ steps.meta.outputs.sha }}",
                  "ghcr.io/${{ steps.meta.outputs.repo_lower }}/groundstack-api:${{ steps.meta.outputs.version }}",
                  "ghcr.io/${{ steps.meta.outputs.repo_lower }}/groundstack-api:${{ steps.meta.outputs.sha }}"
                ],
                "digest": "${{ steps.images.outputs.api_digest }}"
              },
              "web": {
                "tags": [
                  "groundstack-web:${{ steps.meta.outputs.version }}",
                  "groundstack-web:${{ steps.meta.outputs.sha }}",
                  "ghcr.io/${{ steps.meta.outputs.repo_lower }}/groundstack-web:${{ steps.meta.outputs.version }}",
                  "ghcr.io/${{ steps.meta.outputs.repo_lower }}/groundstack-web:${{ steps.meta.outputs.sha }}"
                ],
                "digest": "${{ steps.images.outputs.web_digest }}"
              }
            },
            "database_migration_revision": "$(cd apps/api && python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          c=Config('alembic.ini')
          s=ScriptDirectory.from_config(c)
          print(s.get_current_head())
          PY
          )",
            "embedding_model": "configured-at-runtime",
            "generation_model": "configured-at-runtime",
            "prompt_version": "configured-at-runtime",
            "evaluation_report_identifier": "required-before-production"
          }
          JSON
      - name: Push images to GHCR
        if: ${{ inputs.push_ghcr == true }}
        run: |
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push ghcr.io/${{ steps.meta.outputs.repo_lower }}/groundstack-api:${{ steps.meta.outputs.version }}
          docker push ghcr.io/${{ steps.meta.outputs.repo_lower }}/groundstack-api:${{ steps.meta.outputs.sha }}
          docker push ghcr.io/${{ steps.meta.outputs.repo_lower }}/groundstack-web:${{ steps.meta.outputs.version }}
          docker push ghcr.io/${{ steps.meta.outputs.repo_lower }}/groundstack-web:${{ steps.meta.outputs.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: GHCR push disabled unless requested
        if: ${{ inputs.push_ghcr != true }}
        run: echo "GHCR push skipped."
