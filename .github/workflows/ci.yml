name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: groundstack
          POSTGRES_PASSWORD: groundstack
          POSTGRES_DB: groundstack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U groundstack -d groundstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
      - name: Install PostgreSQL 17 client utilities
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Verify PostgreSQL 17 client utilities
        run: |
          command -v pg_dump
          pg_dump --version
          command -v pg_restore
          pg_restore --version
          command -v psql
          psql --version
          pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 17\.'
          pg_restore --version | grep -Eq '^pg_restore \(PostgreSQL\) 17\.'
          psql --version | grep -Eq '^psql \(PostgreSQL\) 17\.'
      - run: npm ci
      - run: npm run lint --workspace apps/web
      - run: npm run typecheck --workspace apps/web
      - run: npm run test --workspace apps/web
      - run: npm run build --workspace apps/web
      - run: python -m pip install -e "apps/api[dev]"
      - run: cd apps/api && ruff format --check .
      - run: cd apps/api && ruff check .
      - run: python -m compileall -q apps/api/app
      - run: cd apps/api && alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://groundstack:groundstack@localhost:5432/groundstack
      - run: cd apps/api && pytest
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://groundstack:groundstack@localhost:5432/groundstack
      - run: PYTHONPATH=. GROUNDSTACK_LOAD_MAX_REQUESTS=1 python -c "import load.locustfile"
      - run: PYTHONPATH=. python -m pytest tests/load
      - run: PYTHONPATH=. python -m load.run_locust_profile --profile smoke --dry-run
      - run: python scripts/capacity_report.py --validate-only
      - run: python scripts/failure_test.py --validate-only
      - run: python scripts/integrity_check.py --validate-only
      - run: cd training && PYTHONPATH=. python -m pytest
      - run: PYTHONPATH=evaluation python -m pytest evaluation/tests
      - run: PYTHONPATH=evaluation python evaluation/runners/run_eval.py --suite all
      - run: python scripts/check_migrations.py

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # docker/setup-buildx-action v3.11.0
      - uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0
      - run: docker build -f apps/api/Dockerfile -t groundstack-api:ci .
      - run: docker build -f apps/web/Dockerfile -t groundstack-web:ci .

  dependency-and-secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm audit --audit-level=high
      - run: python -m pip install pip-audit && pip-audit --path apps/api
      - run: python scripts/secret_scan.py --self-test
      - run: python scripts/secret_scan.py
