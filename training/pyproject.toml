[project]
name = "groundstack-training"
version = "0.1.0"
description = "Reproducible GroundStack dataset and QLoRA adapter training utilities."
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "ruff>=0.12.9"
]
qlora = [
  "accelerate>=1.10.0",
  "bitsandbytes>=0.46.0",
  "datasets>=4.0.0",
  "peft>=0.17.0",
  "torch>=2.6.0",
  "transformers>=4.55.0",
  "trl>=0.21.0"
]

[tool.setuptools.packages.find]
include = ["groundstack_training*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
