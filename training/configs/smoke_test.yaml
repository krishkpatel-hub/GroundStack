base_model: tiny-groundstack-smoke
requires_llama_license_acknowledgement: false
prompt_version: grounded_answer/v1
smoke_test: true
dataset:
  name: groundstack-seed-dev-smoke
  version: 0.1.0
  source_path: training/data/seed/groundstack_seed.jsonl
  output_dir: training/data/processed/smoke
  near_duplicate_threshold: 0.985
split:
  seed: 1729
  train_ratio: 0.7
  validation_ratio: 0.15
qlora:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: fp16
  gradient_checkpointing: true
  disable_model_cache: true
lora:
  rank: 2
  alpha: 4
  dropout: 0.0
  target_modules: q_proj,down_proj
training:
  learning_rate: 0.0002
  epochs: 1
  max_sequence_length: 512
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  warmup_ratio: 0.0
  scheduler: cosine
  weight_decay: 0.0
  gradient_clipping: 1.0
  completion_only_loss: true
  assistant_only_loss: validate_template_mask_first
  seed: 1729
  output_root: training/reports/runs
