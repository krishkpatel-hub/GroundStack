services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: groundstack-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-groundstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundstack}
      POSTGRES_DB: ${POSTGRES_DB:-groundstack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groundstack} -d ${POSTGRES_DB:-groundstack}"]
      interval: 5s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.4.2
    profiles: ["observability"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-groundstack}

volumes:
  postgres-data:
